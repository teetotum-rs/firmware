name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach firmware binaries to
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  firmware:
    name: Firmware binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      # The image script comes from the workflow's own revision, so older tags can be released too.
      - uses: actions/checkout@v5
        with:
          path: current
          sparse-checkout: tools/firmware-images
          sparse-checkout-cone-mode: false
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: true
          buildtargets: esp32s3
          version: 1.97.0.0
      - uses: Swatinem/rust-cache@v2
      - name: Install espflash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v4.5.0 -R esp-rs/espflash -p espflash-x86_64-unknown-linux-musl.zip -D "$RUNNER_TEMP"
          unzip -o "$RUNNER_TEMP/espflash-x86_64-unknown-linux-musl.zip" -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        # Only the firmware: some measurement programs embed test images that are not in the repository.
        run: cargo build --release --bin teetotum-firmware
      - name: Make images
        run: |
          cp current/tools/firmware-images tools/firmware-images
          sh tools/firmware-images target/xtensa-esp32s3-none-elf/release/teetotum-firmware "$TAG" dist
      - name: Release notes from the changelog
        run: |
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<'EOF'

          ### Firmware binaries

          Install them from the browser at https://teetotum-rs.github.io/firmware/, or write the four
          parts at the offsets listed in `manifest.json`. Settings and plugin slots are kept.

          The `.tfw` file is the same firmware, signed, for an update over Bluetooth from the
          TeeToTum app. It is signed outside CI and attached a little after the other files.
          EOF
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "TeeToTum $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" dist/* --clobber

  citation:
    name: Citation version
    # Only a new tag moves the citation; building an older tag again leaves it alone.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Set version and release date in CITATION.cff
        run: |
          version="${TAG#v}"
          current=$(sed -n 's/^version: //p' CITATION.cff)
          if [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)" != "$version" ]; then
            echo "CITATION.cff names $current, newer than $version"
            exit 0
          fi
          date=$(git log -1 --format=%cs "$TAG")
          sed -i "s/^version: .*/version: $version/" CITATION.cff
          if grep -q '^date-released:' CITATION.cff; then
            sed -i "s/^date-released: .*/date-released: \"$date\"/" CITATION.cff
          else
            sed -i "/^version: /a date-released: \"$date\"" CITATION.cff
          fi
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898187+github-actions[bot]@users.noreply.github.com"
          git commit -am "Cite version $version"
          git push
