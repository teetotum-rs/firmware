[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --chip esp32s3 -B 921600 --partition-table partitions.csv --erase-parts otadata"

[env]
ESP_LOG="info"

[build]
rustflags = [
  "-C", "link-arg=-nostartfiles",
]

target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["alloc", "core"]
