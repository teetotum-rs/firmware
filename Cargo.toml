# The firmware repository is a workspace, because the stable interfaces are the
# crates on crates.io and not this tree: `teetotum-face`, which a face -- a
# plugin -- is written against, and `teetotum`, the drivers and the drawing a
# firmware is built from. Keeping both next to the firmware and the faces it
# ships is what makes a break in them fail the build here rather than in
# somebody else's checkout.
[workspace]
members  = ["firmware", "teetotum", "teetotum-face"]
resolver = "3"
# Plugins build for wasm32v1-none, and cargo takes the target per invocation, not per package.
exclude = ["plugins"]

# `cargo run --release` still flashes the firmware, the way it did when this was
# a single package.
default-members = ["firmware"]

[workspace.package]
authors      = ["Stefan Grühn"]
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/teetotum-rs/firmware"
rust-version = "1.88"
version      = "0.1.0"

[workspace.dependencies]
teetotum      = { path = "teetotum", version = "0.1.0" }
teetotum-face = { path = "teetotum-face", version = "0.1.0" }

bt-hci                 = "0.8.0"
critical-section       = "1.2.0"
embassy-executor       = { version = "0.10.0", features = ["log"] }
embassy-futures        = "0.1.2"
embassy-net            = { version = "0.9.1", features = [
  "dhcpv4",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
# Required by trouble-host's #[gatt_server] macro, which names it in generated code.
embassy-sync           = "0.7.2"
embassy-time           = { version = "0.5.0", features = ["log"] }
embedded-graphics      = "0.8"
embedded-io            = "0.7.1"
embedded-io-async      = "0.7.0"
embedded-storage       = "0.3.1"
esp-alloc              = "0.10.0"
esp-backtrace          = { version = "0.19.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3", "log-04"] }
esp-hal                = { version = "~1.1.0", features = ["esp32s3", "log-04", "unstable"] }
esp-storage            = { version = "0.9.0", features = ["esp32s3", "esp-hal"] }
esp-println            = { version = "0.17.0", features = ["esp32s3", "log-04"] }
esp-radio              = { version = "0.18.0", features = [
  "ble",
  "coex",
  "esp-alloc",
  "esp32s3",
  "log-04",
  "unstable",
  "wifi",
] }
esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }
log = "0.4.27"
# for more networking protocol support see https://crates.io/crates/edge-net
smoltcp = { version = "0.13.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
st77916      = "0.1.1"
# Sans-serif bitmap fonts for the settings menu. The largest font embedded-graphics
# brings, 10x20, is 2.5 mm tall on this glass and has serifs.
u8g2-fonts   = "0.8.0"
static_cell  = "2.1.1"
trouble-host = { version = "0.6.0", features = ["gatt", "scan"] }
# The plugin runtime. `validate` stays on: it is the switch for modules from strangers, and
# without it wasmi only offers `unsafe Module::new_unchecked`. `auto-dispatch` falls back to the
# portable loop on Xtensa, which wasmi's build script lists as having no guaranteed tail calls.
# `indirect-dispatch` encodes each op as a 16-bit code with 16-bit slots instead of a function
# pointer with 32-bit ones: measured with `firmware/src/bin/faceheap.rs`, the translated code of
# a face shrinks by 45 % (Nearby holds 22.9 KB of heap instead of 31.1), and a call got faster,
# not slower (a wipe 10.1 us instead of 10.4). The heap is what limits the largest face.
wasmi = { version = "2.0.0", default-features = false, features = [
  "auto-dispatch",
  "indirect-dispatch",
  "libm",
  "prefer-btree-collections",
  "validate",
] }
zune-jpeg    = { version = "0.5.15", default-features = false }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
