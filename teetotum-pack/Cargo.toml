# Checks a face before any of its code runs: whether its signature holds, and who it is.
#
# `no_std` and without allocation, so the firmware and a tool on the host run the same checks.
# The manifest itself is read by `teetotum-face`; what needs Ed25519 lives here, out of every face.
[package]
authors      = { workspace = true }
categories   = ["command-line-utilities", "embedded", "no-std::no-alloc"]
description  = "Verify the signature and identity of a face -- a plugin -- for the teetotum firmware"
edition      = { workspace = true }
keywords     = ["ed25519", "esp32", "plugin", "signing", "teetotum"]
license      = { workspace = true }
name         = "teetotum-pack"
readme       = "README.md"
repository   = { workspace = true }
rust-version = { workspace = true }
version      = { workspace = true }

[features]
# Signing, which allocates. Off by default, so the firmware's Xtensa build never meets `std`.
std = ["ed25519-compact/std"]
# The command-line tool, which also reads and writes PEM keys and makes new ones.
cli = ["std", "ed25519-compact/pem", "ed25519-compact/random"]

[[bin]]
name              = "teetotum-pack"
path              = "src/main.rs"
required-features = ["cli"]

[dependencies]
teetotum-face = { workspace = true }

ed25519-compact = { workspace = true }
